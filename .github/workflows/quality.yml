name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install browser dependencies
        # `playwright` lives under the separate `browser` extra (not `dev`).
        # Without this, TestImageStatusContentIdJsAgainstRealDom (issue #820
        # finding #4) silently skips via `_chromium_available()`, and the
        # real-DOM coverage it exists to provide never actually executes.
        run: |
          pip install -e ".[browser]"
          playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Run offline tests
        # Offline default comes from pyproject addopts (skips the live-network
        # markers). integration_write stays in — it replays VCR cassettes offline.
        run: pytest
